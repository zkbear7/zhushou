<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>考研助手 · 每日仪表盘</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#fdf8f4">
<link rel="manifest" href="./manifest.json">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/lxgw-wenkai-screen-webfont@1.7.0/style.css">
<style>
:root {
  --bg: #fdf8f4;
  --card: #fffefb;
  --card2: #faf6f0;
  --text: #3d3929;
  --text2: #8b8680;
  --text3: #b8b3ab;
  --divider: #e8e3dc;
  --accent: #c4a882;
  --accent-light: #e8dccf;
  --green: #a3b899;
  --green-light: #e2ecda;
  --rose: #c8a8a8;
  --rose-light: #f0e4e4;
  --lavender: #b8b0c8;
  --lavender-light: #e8e4f0;
  --amber: #d4b896;
  --amber-light: #f0e4d4;
  --radius: 14px;
  --radius-sm: 10px;
  --shadow: 0 2px 12px rgba(61,57,41,0.06);
  --font: 'LXGW WenKai Screen', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif;
  --transition: 0.25s cubic-bezier(0.4, 0, 0.2, 1);
}

* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { height: 100%; overflow: hidden; }
body {
  font-family: var(--font);
  background: var(--bg);
  color: var(--text);
  -webkit-font-smoothing: antialiased;
  display: flex;
  flex-direction: column;
  user-select: none;
  -webkit-tap-highlight-color: transparent;
}

/* ── Top Bar ── */
.topbar {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 14px 20px;
  background: var(--card);
  border-bottom: 1px solid var(--divider);
  flex-shrink: 0;
  z-index: 10;
}
.menu-btn {
  width: 40px; height: 40px;
  border: none; background: none;
  font-size: 22px; cursor: pointer;
  border-radius: var(--radius-sm);
  display: flex; align-items: center; justify-content: center;
  color: var(--text);
  flex-shrink: 0;
}
.menu-btn:active { background: var(--accent-light); }
.countdown-badge {
  display: flex; align-items: center; gap: 8px;
  margin-left: auto;
  background: var(--accent-light);
  padding: 8px 16px;
  border-radius: 20px;
  font-size: 14px;
  color: var(--text);
  font-weight: 500;
}
.countdown-num {
  font-size: 22px;
  font-weight: 700;
  color: #8b6f4e;
  line-height: 1;
}
.today-label {
  font-size: 15px;
  color: var(--text2);
  font-weight: 500;
}

/* ── Main Content ── */
.main {
  flex: 1;
  overflow-y: auto;
  padding: 16px 20px 32px;
  display: flex;
  flex-direction: column;
  gap: 16px;
  -webkit-overflow-scrolling: touch;
}

/* ── Now Card ── */
.now-card {
  background: var(--card);
  border-radius: var(--radius);
  padding: 22px 20px;
  box-shadow: var(--shadow);
  border: 1px solid var(--divider);
  text-align: center;
}
.now-time {
  font-size: 14px;
  color: var(--text2);
  letter-spacing: 0.5px;
}
.now-task-icon {
  font-size: 40px;
  margin: 8px 0 4px;
  line-height: 1;
}
.now-task-title {
  font-size: 24px;
  font-weight: 700;
  color: var(--text);
  line-height: 1.4;
}
.now-task-sub {
  font-size: 15px;
  color: var(--text2);
  margin-top: 2px;
}
.now-task-time {
  display: inline-block;
  margin-top: 10px;
  padding: 4px 14px;
  background: var(--accent-light);
  border-radius: 12px;
  font-size: 13px;
  color: #8b6f4e;
  font-weight: 500;
}

/* ── Timeline ── */
.timeline-card {
  background: var(--card);
  border-radius: var(--radius);
  padding: 18px 16px;
  box-shadow: var(--shadow);
  border: 1px solid var(--divider);
}
.timeline-title {
  font-size: 15px;
  font-weight: 600;
  color: var(--text2);
  margin-bottom: 14px;
  letter-spacing: 0.5px;
  display: flex;
  align-items: center;
  gap: 8px;
}
.timeline-title .dot {
  width: 8px; height: 8px;
  border-radius: 50%;
  background: var(--accent);
}
.timeline-list { list-style: none; display: flex; flex-direction: column; gap: 2px; }
.timeline-item {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 10px 12px;
  border-radius: var(--radius-sm);
  cursor: pointer;
  transition: var(--transition);
  position: relative;
}
.timeline-item:active { background: var(--bg); }
.timeline-item.done .tl-label { text-decoration: line-through; opacity: 0.45; }
.timeline-item.done .tl-marker { opacity: 0.3; }
.tl-marker {
  width: 10px; height: 10px;
  border-radius: 50%;
  flex-shrink: 0;
  transition: var(--transition);
}
.tl-marker.math { background: var(--amber); }
.tl-marker.eng  { background: var(--lavender); }
.tl-marker.pro  { background: var(--green); }
.tl-marker.gym  { background: var(--rose); }
.tl-marker.rest { background: #d0d0d0; }
.tl-marker.eat  { background: #e0d8c8; }
.tl-marker.pol  { background: #d4a9a9; }
.tl-time {
  font-size: 13px;
  color: var(--text3);
  width: 80px;
  flex-shrink: 0;
  font-variant-numeric: tabular-nums;
}
.tl-label {
  font-size: 15px;
  color: var(--text);
  flex: 1;
  transition: var(--transition);
}
.tl-check {
  width: 22px; height: 22px;
  border-radius: 50%;
  border: 2px solid var(--divider);
  flex-shrink: 0;
  display: flex; align-items: center; justify-content: center;
  font-size: 12px;
  transition: var(--transition);
}
.timeline-item.done .tl-check {
  background: var(--green);
  border-color: var(--green);
  color: white;
}
.tl-check::after { content: ''; }
.timeline-item.done .tl-check::after { content: '✓'; }

/* ── Drawer Overlay ── */
.overlay {
  position: fixed; inset: 0;
  background: rgba(61,57,41,0.25);
  z-index: 20;
  opacity: 0;
  pointer-events: none;
  transition: opacity var(--transition);
}
.overlay.open { opacity: 1; pointer-events: auto; }

/* ── Side Drawer ── */
.drawer {
  position: fixed;
  left: 0; top: 0; bottom: 0;
  width: 320px;
  max-width: 82vw;
  background: var(--card);
  z-index: 30;
  box-shadow: 2px 0 24px rgba(61,57,41,0.1);
  transform: translateX(-100%);
  transition: transform var(--transition);
  display: flex;
  flex-direction: column;
  overflow: hidden;
}
.drawer.open { transform: translateX(0); }
.drawer-header {
  padding: 20px 18px 14px;
  border-bottom: 1px solid var(--divider);
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-shrink: 0;
}
.drawer-title { font-size: 17px; font-weight: 600; color: var(--text); }
.drawer-close {
  width: 36px; height: 36px;
  border: none; background: none;
  font-size: 20px; cursor: pointer;
  border-radius: 50%;
  color: var(--text2);
  display: flex; align-items: center; justify-content: center;
}
.drawer-close:active { background: var(--bg); }
.drawer-body {
  flex: 1;
  overflow-y: auto;
  padding: 8px 0;
  -webkit-overflow-scrolling: touch;
}

/* ── Drawer Accordion ── */
.accordion {
  border-bottom: 1px solid var(--divider);
}
.accordion-header {
  display: flex; align-items: center; justify-content: space-between;
  padding: 14px 18px;
  cursor: pointer;
  font-size: 15px;
  font-weight: 500;
  color: var(--text);
  transition: var(--transition);
}
.accordion-header:active { background: var(--bg); }
.accordion-arrow {
  font-size: 12px;
  color: var(--text3);
  transition: transform var(--transition);
}
.accordion.open .accordion-arrow { transform: rotate(90deg); }
.accordion-body {
  max-height: 0;
  overflow: hidden;
  transition: max-height 0.35s ease;
}
.accordion.open .accordion-body { max-height: 2000px; }
.accordion-inner {
  padding: 0 18px 16px;
}
.accordion-inner table {
  width: 100%;
  border-collapse: collapse;
  font-size: 13px;
}
.accordion-inner th {
  text-align: left;
  padding: 6px 8px 4px;
  font-size: 11px;
  color: var(--text3);
  font-weight: 500;
  letter-spacing: 0.5px;
}
.accordion-inner td {
  padding: 6px 8px;
  border-top: 1px solid var(--divider);
  color: var(--text);
  line-height: 1.5;
}
.priority-dot {
  display: inline-block;
  width: 8px; height: 8px;
  border-radius: 50%;
  margin-right: 6px;
  vertical-align: middle;
}
.priority-dot.red { background: #d48585; }
.priority-dot.yellow { background: #d4c885; }
.priority-dot.orange { background: #d4a878; }
.priority-dot.green { background: #a3b899; }
.priority-dot.gray { background: #c0c0c0; }
.tag {
  display: inline-block;
  padding: 2px 8px;
  border-radius: 8px;
  font-size: 11px;
  font-weight: 500;
  margin: 1px 2px;
}
.tag.red { background: #fce8e8; color: #a05050; }
.tag.green { background: #e8f0e0; color: #5a805a; }
.tag.blue { background: #e0e8f0; color: #506888; }
.tag.amber { background: #f0ead8; color: #806840; }

/* ── Notification Permission Banner ── */
.notify-banner {
  display: none;
  align-items: center;
  gap: 12px;
  padding: 12px 16px;
  background: var(--amber-light);
  margin: 0 20px 8px;
  border-radius: var(--radius-sm);
  font-size: 14px;
  color: #6b5530;
}
.notify-banner.show { display: flex; }
.notify-btn {
  margin-left: auto;
  border: none;
  background: #8b6f4e;
  color: white;
  padding: 8px 16px;
  border-radius: 16px;
  font-size: 13px;
  font-family: var(--font);
  cursor: pointer;
  white-space: nowrap;
}
.notify-btn:active { opacity: 0.8; }
.notify-dismiss {
  background: none;
  border: none;
  font-size: 18px;
  cursor: pointer;
  color: #8b6f4e;
  padding: 4px;
}

/* ── Rest Day Card ── */
.rest-card {
  text-align: center;
  padding: 40px 20px;
  background: var(--card);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  border: 1px solid var(--divider);
}
.rest-icon { font-size: 56px; margin-bottom: 8px; }
.rest-text { font-size: 20px; font-weight: 600; color: var(--text); }
.rest-sub { font-size: 14px; color: var(--text2); margin-top: 6px; }

/* ── Week Card ── */
.week-card {
  background: var(--card);
  border-radius: var(--radius);
  padding: 16px 18px;
  box-shadow: var(--shadow);
  border: 1px solid var(--divider);
}
.week-card .week-title {
  font-size: 14px; font-weight: 600; color: var(--text2);
  margin-bottom: 10px;
  display: flex; align-items: center; gap: 6px;
}
.week-subject {
  margin-bottom: 8px;
}
.week-subject:last-child { margin-bottom: 0; }
.week-sub-name {
  font-size: 12px; font-weight: 600; color: var(--text3);
  letter-spacing: 0.5px; margin-bottom: 2px;
}
.week-sub-item {
  font-size: 13px; color: var(--text); line-height: 1.6;
  padding-left: 8px;
}

/* ── Full Plan Drawer ── */
.plan-phase {
  margin-bottom: 12px;
}
.plan-phase-title {
  font-size: 14px; font-weight: 600; color: var(--text);
  margin-bottom: 4px;
}
.plan-phase table { width: 100%; border-collapse: collapse; font-size: 11px; }
.plan-phase th { text-align: left; padding: 3px 4px; font-size: 10px; color: var(--text3); border-bottom: 1px solid var(--divider); }
.plan-phase td { padding: 3px 4px; border-bottom: 1px solid var(--divider); color: var(--text); }
.plan-phase .done-tag { font-size: 10px; padding: 1px 6px; border-radius: 6px; }
.done-tag.math { background: var(--amber-light); color: #806840; }
.done-tag.pro { background: var(--green-light); color: #5a805a; }
.done-tag.eng { background: var(--lavender-light); color: #506888; }
.done-tag.pol { background: var(--rose-light); color: #a05050; }

/* ── Stats Panel ── */
.stats-card {
  background: var(--card);
  border-radius: var(--radius);
  padding: 16px 18px;
  box-shadow: var(--shadow);
  border: 1px solid var(--divider);
}
.stats-header {
  display: flex; align-items: center; justify-content: space-between;
  margin-bottom: 12px;
}
.stats-title {
  font-size: 14px; font-weight: 600; color: var(--text2);
  display: flex; align-items: center; gap: 6px;
}
.stats-pct {
  font-size: 28px; font-weight: 700; color: var(--accent);
}
.stats-bar-row {
  display: flex; align-items: flex-end; gap: 4px;
  height: 60px;
}
.stats-bar-col {
  flex: 1; display: flex; flex-direction: column; align-items: center;
  gap: 4px;
}
.stats-bar {
  width: 100%; border-radius: 4px 4px 0 0;
  transition: height var(--transition);
  min-height: 4px;
}
.stats-bar.today { background: var(--accent); }
.stats-bar.other { background: var(--divider); }
.stats-bar-label {
  font-size: 10px; color: var(--text3);
}
.stats-sub {
  display: flex; justify-content: space-between;
  margin-top: 8px; font-size: 11px; color: var(--text3);
}

/* ── Scrollbar ── */
.main::-webkit-scrollbar, .drawer-body::-webkit-scrollbar { width: 4px; }
.main::-webkit-scrollbar-thumb, .drawer-body::-webkit-scrollbar-thumb { background: var(--divider); border-radius: 4px; }

/* ── Responsive for tablet ── */
@media (min-width: 768px) {
  .main { padding: 20px 32px 32px; }
  .now-card { padding: 28px 24px; }
  .now-task-title { font-size: 28px; }
  .timeline-card { padding: 22px 20px; }
  .tl-time { width: 100px; }
}
</style>
</head>
<body>

<!-- PIN Lock Screen -->

<!-- Side Drawer -->
<div class="overlay" id="overlay" onclick="closeDrawer()"></div>
<aside class="drawer" id="drawer">
  <div class="drawer-header">
    <span class="drawer-title">📖 备考资料库</span>
    <button class="drawer-close" onclick="closeDrawer()">✕</button>
  </div>
  <div class="drawer-body" id="drawerBody"></div>
</aside>

<!-- Top Bar -->
<header class="topbar">
  <button class="menu-btn" onclick="openDrawer()" aria-label="菜单">☰</button>
  <span class="today-label" id="todayLabel"></span>
  <div class="countdown-badge">
    <span>距初试</span>
    <span class="countdown-num" id="countdownNum"></span>
    <span>天</span>
  </div>
</header>

<!-- Notification Permission -->
<div class="notify-banner" id="notifyBanner">
  <span>🔔</span>
  <span>开启通知，准时提醒学习</span>
  <button class="notify-dismiss" onclick="dismissNotify()">✕</button>
  <button class="notify-btn" onclick="requestNotify()">开启</button>
</div>

<!-- Main -->
<main class="main" id="mainContent"></main>

<script>
// ═══════════════════════════════════════
// DATA
// ═══════════════════════════════════════

const EXAM_DATE = new Date(2026, 11, 20); // Dec 20, 2026

// ── June 2026 daily schedules (date-specific) ──
const JUNE_DAYS = {
  // 六级冲刺期 6.5-6.12
  '2026-06-05': { tag: '六级冲刺', emoji: '📝', schedule: [
    { t:'09:00-12:00', l:'六级真题阅读精做', s:'eng' },
    { t:'12:00-13:30', l:'午饭 + 午休', s:'rest' },
    { t:'13:30-15:00', l:'六级听力训练', s:'eng' },
    { t:'15:00-16:30', l:'六级作文模板整理', s:'eng' },
    { t:'16:30-18:00', l:'单词复习', s:'eng' },
    { t:'18:00-19:30', l:'晚饭 + 休息', s:'rest' },
    { t:'19:30-21:30', l:'错题回顾 + 轻松看课', s:'eng' },
  ]},
  '2026-06-10': { tag: '实习日 · 六级冲刺', emoji: '🏢', schedule: [
    { t:'白天', l:'实习（全天占用）', s:'rest' },
    { t:'晚间 1-2h', l:'视频课轻松看（线代/概率 2x）', s:'math' },
    { t:'每天', l:'闪过单词 100 词（保持）', s:'eng' },
  ]},
  '2026-06-13': { tag: '六级考试日', emoji: '🎯', schedule: [
    { t:'上午', l:'六级考试', s:'eng' },
    { t:'考后', l:'考完就过，不对答案不纠结', s:'rest' },
    { t:'晚间', l:'可选看 30min 线代视频放松', s:'math' },
  ]},
  '2026-06-15': { tag: '实习日 · 期末备考', emoji: '🏢', schedule: [
    { t:'白天', l:'实习（全天占用）', s:'rest' },
    { t:'其余时间', l:'全部给期末复习', s:'rest' },
    { t:'每天', l:'闪过单词 100 词（保持）', s:'eng' },
  ]},
  '2026-06-18': { tag: '期末考试日', emoji: '📋', schedule: [
    { t:'白天', l:'期末考试', s:'rest' },
    { t:'考后', l:'休息调整', s:'rest' },
    { t:'每天', l:'闪过单词 100 词', s:'eng' },
  ]},
  '2026-06-28': { tag: '期末考试日', emoji: '📋', schedule: [
    { t:'白天', l:'期末考试', s:'rest' },
    { t:'考后', l:'休息调整', s:'rest' },
    { t:'每天', l:'闪过单词 100 词', s:'eng' },
  ]},
  '2026-06-29': { tag: '彻底休息', emoji: '😴', schedule: [], rest: true },
  '2026-06-30': { tag: '彻底休息', emoji: '😴', schedule: [], rest: true },
};

// Generate June recurring days
function genJuneSchedules() {
  const sched = {};
  for (let d = 5; d <= 30; d++) {
    const key = `2026-06-${String(d).padStart(2,'0')}`;
    if (JUNE_DAYS[key]) { sched[key] = JUNE_DAYS[key]; continue; }
    if (d >= 5 && d <= 12 && d !== 10) {
      sched[key] = JUNE_DAYS['2026-06-05']; // 六级冲刺
    } else if (d >= 14 && d <= 18 && d !== 15) {
      sched[key] = { tag: '期末备考', emoji: '📚', schedule: [
        { t:'全天', l:'全力备考期末（6.18 考试）', s:'rest' },
        { t:'每天', l:'闪过单词 100 词', s:'eng' },
      ]};
    } else if (d >= 19 && d <= 21) {
      sched[key] = { tag: '积分集中突破', emoji: '🔥', schedule: [
        { t:'上午 2h', l:'第8+9讲 积分 · 视频 1.5x', s:'math' },
        { t:'下午 2h', l:'整理笔记 + 独立重做例题', s:'math' },
        { t:'下午 1h', l:'课后题检验 2-3 道', s:'math' },
        { t:'晚上 1h', l:'单词 + 轻松看课', s:'eng' },
      ]};
    } else if (d >= 22 && d <= 23) {
      sched[key] = { tag: '课设日', emoji: '🛠️', schedule: [
        { t:'全天', l:'课设集中搞定', s:'rest' },
        { t:'每天', l:'闪过单词 100 词', s:'eng' },
      ]};
    } else if (d >= 24 && d <= 28 && d !== 28) {
      sched[key] = { tag: '期末备考', emoji: '📚', schedule: [
        { t:'全天', l:'全力备考期末（6.28 考试）', s:'rest' },
        { t:'晚间余力', l:'线代 30 讲视频 2x 纯看（磨耳朵）', s:'math' },
        { t:'每天', l:'闪过单词 100 词', s:'eng' },
      ]};
    }
  }
  return sched;
}
const JUNE = genJuneSchedules();

// ── July+ recurring schedules (updated: 椭圆机, 9:00 start) ──
const GYM_DAY_SCHEDULE = [
  { t:'09:00-09:30', l:'📖 单词 · 闪过纸质背诵', s:'eng' },
  { t:'09:30-11:00', l:'数学一 · 高强度 1.5h', s:'math' },
  { t:'11:00-11:15', l:'🍌 练前加餐（香蕉+坚果）', s:'eat' },
  { t:'11:15-12:45', l:'🏋️ 椭圆机+轻度无氧+🚿洗澡', s:'gym' },
  { t:'12:45-13:30', l:'🍜 练后午餐+休息', s:'eat' },
  { t:'13:30-15:30', l:'828 自控 · 2h', s:'pro' },

// LOGIC
// ═══════════════════════════════════════

function fmtDate(d) {
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}

function isGymDay(date) {
  // July 1 = gym day, then every other day from July 1 onward
  const july1 = new Date(2026, 6, 1);
  const diffDays = Math.floor((date - july1) / (1000 * 60 * 60 * 24));
  if (diffDays < 0) return false; // Before July 1, no gym schedule
  return diffDays % 2 === 0;
}

function isRestDay(date) {
  // 学6休1: every 7th day starting July 1
  const july1 = new Date(2026, 6, 1);
  const diffDays = Math.floor((date - july1) / (1000 * 60 * 60 * 24));
  if (diffDays < 0) return false; // Before July 1
  return (diffDays % 7 === 6); // 7th day (0-indexed, so 6 = 7th)
}

function getTodayKey() {
  return fmtDate(new Date());
}

// ── Phase detection ──
function getPhase(date) {
  const m = date.getMonth(), d = date.getDate();
  if (m === 5) return 'june';                          // June: 日期特定
  if (m === 6 && d <= 31) return 'july-high';          // July: 高数强化期
  if (m === 7 && d <= 22) return 'aug-lineprob';       // Aug 1-22: 线代概率刷题
  if (m === 7 && d >= 23) return 'aug-late';           // Aug 23+: 强化收尾+现控
  if (m >= 8) return 'fall';                           // Sep+: 秋季强化
  return 'july-high';
}

function getSchedule(date) {
  const key = fmtDate(date);
  const phase = getPhase(date);

  // June: lookup specific day
  if (phase === 'june') {
    if (JUNE[key]) return JUNE[key];
    return { tag: '六月过渡期', emoji: '📋', schedule: [
      { t:'全天', l:'按备考规划执行', s:'rest' }
    ]};
  }

  // Rest day check for July+
  if (isRestDay(date)) {
    return { tag: '休息日', emoji: '😴', rest: true, schedule: [] };
  }

  const gym = isGymDay(date);

  // Phase-aware labels
  const phaseLabels = {
    'july-high': {
      gymTag: '健身日 · 高数强化期 🏋️',
      nonGymTag: '非健身日 · 高数强化期 📖',
      gymEmoji: '🏋️', nonGymEmoji: '🔢',
    },
    'aug-lineprob': {
      gymTag: '健身日 · 线代概率刷题 🏋️',
      nonGymTag: '非健身日 · 线代概率刷题 📖',
      gymEmoji: '🏋️', nonGymEmoji: '📐',
    },
    'aug-late': {
      gymTag: '健身日 · 强化收尾+现控 🏋️',
      nonGymTag: '非健身日 · 强化收尾+现控 📖',
      gymEmoji: '🏋️', nonGymEmoji: '⚙️',
    },
    'fall': {
      gymTag: '健身日 · 秋季强化期 🏋️',
      nonGymTag: '非健身日 · 秋季强化期 📖',
      gymEmoji: '🏋️', nonGymEmoji: '📚',
    },
  };
  const pl = phaseLabels[phase] || phaseLabels['july-high'];

  return {
    tag: gym ? pl.gymTag : pl.nonGymTag,
    emoji: gym ? pl.gymEmoji : pl.nonGymEmoji,
    gym: gym,
    phase: phase,
    schedule: gym ? GYM_DAY_SCHEDULE : NON_GYM_DAY_SCHEDULE,
  };
}

function getCurrentTask(schedule, now) {
  if (!schedule || schedule.length === 0) return null;
  const currentMinutes = now.getHours() * 60 + now.getMinutes();

  let currentTask = null;
  let nextTask = null;

  for (let i = 0; i < schedule.length; i++) {
    const item = schedule[i];
    const timeStr = item.t;
    // Parse time range like "09:00-12:00" or "11:00-11:15" or simpler patterns
    const match = timeStr.match(/(\d{1,2}):(\d{2})\s*[-–]\s*(\d{1,2}):(\d{2})/);
    if (!match) continue;
    const startMin = parseInt(match[1]) * 60 + parseInt(match[2]);
    const endMin = parseInt(match[3]) * 60 + parseInt(match[4]);

    if (currentMinutes >= startMin && currentMinutes < endMin) {
      currentTask = { item, startMin, endMin };
      break;
    } else if (currentMinutes < startMin && !nextTask) {
      nextTask = { item, startMin, endMin };
    }
  }

  if (currentTask) return { type: 'now', ...currentTask };
  if (nextTask) return { type: 'next', ...nextTask };
  return { type: 'done', item: { t:'今天的学习结束了', l:'休息吧，明天继续加油 🌙', s:'rest' }, startMin: 0, endMin: 0 };
}

// LOCAL STORAGE (task check-off)
// ═══════════════════════════════════════

function getDoneSet() {
  const key = 'done_' + getTodayKey();
  try {
    const raw = localStorage.getItem(key);
    return raw ? new Set(JSON.parse(raw)) : new Set();
  } catch { return new Set(); }
}

function saveDoneSet(s) {
  const key = 'done_' + getTodayKey();
  localStorage.setItem(key, JSON.stringify([...s]));
}

// Clean old keys
function cleanOldStorage() {
  const today = getTodayKey();
  const keys = Object.keys(localStorage).filter(k => k.startsWith('done_'));
  keys.forEach(k => {
    if (k !== 'done_' + today) localStorage.removeItem(k);
  });
}

// ── Stats tracking ──
function saveDailyStats(total, done) {
  const key = 'stats_' + getTodayKey();
  localStorage.setItem(key, JSON.stringify({ total, done, date: getTodayKey() }));
}

function getDailyStats(dateKey) {
  try {
    const raw = localStorage.getItem('stats_' + dateKey);
    return raw ? JSON.parse(raw) : null;
  } catch { return null; }
}

function getWeeklyStats() {
  const today = new Date();
  const days = [];
  for (let i = 6; i >= 0; i--) {
    const d = new Date(today);
    d.setDate(d.getDate() - i);
    const key = fmtDate(d);
    const stat = getDailyStats(key);
    days.push({
      label: ['日','一','二','三','四','五','六'][d.getDay()],
      key: key,
      isToday: i === 0,
      total: stat ? stat.total : 0,
      done: stat ? stat.done : 0,
      pct: stat && stat.total > 0 ? Math.round(stat.done / stat.total * 100) : 0,
    });
  }
  return days;
}

function buildStatsHTML(sched, doneSet) {
  if (!sched || sched.length === 0) return '';
  const dateKey = getTodayKey();
  const total = sched.length;
  const done = sched.filter((_, i) => doneSet.has(dateKey + '_' + i)).length;
  const pct = total > 0 ? Math.round(done / total * 100) : 0;

  // Save stats
  saveDailyStats(total, done);

  const week = getWeeklyStats();
  const maxH = 56;

  const bars = week.map(d => {
    const h = d.pct > 0 ? Math.max(4, d.pct / 100 * maxH) : 4;
    const cls = d.isToday ? 'today' : 'other';
    return `<div class="stats-bar-col"><div class="stats-bar ${cls}" style="height:${h}px"></div><span class="stats-bar-label">${d.label}</span></div>`;
  }).join('');

  const streak = calcStreak(week);

  return `
    <div class="stats-card">
      <div class="stats-header">
        <span class="stats-title">📊 打卡统计</span>
        <span class="stats-pct">${pct}%</span>
      </div>
      <div class="stats-bar-row">${bars}</div>
      <div class="stats-sub">
        <span>今日 ${done}/${total} 项完成</span>
        <span>${streak > 0 ? '🔥 连续' + streak + '天打卡' : '今天开始打卡吧'}</span>
      </div>
    </div>`;
}

function calcStreak(week) {
  let s = 0;
  for (let i = week.length - 1; i >= 0; i--) {
    if (week[i].pct > 0) s++; else break;
  }
  return s;
}

      <div class="now-card">
        <div class="now-time">接下来…</div>
        <div class="now-task-icon">⏰</div>
        <div class="now-task-title">${current.item.l}</div>
        <div class="now-task-time">${current.item.t}</div>
      </div>`;
  } else {
    nowHTML = `
      <div class="now-card">
        <div class="now-time">${current.item.l.includes('结束') ? '🎉' : '✨'}</div>
        <div class="now-task-title" style="font-size:20px;">${current.item.l}</div>
      </div>`;
  }

  // Timeline
  let timelineHTML = sched.map((item, i) => {
    const key = `${dateKey}_${i}`;
    const isDone = doneSet.has(key);
    return `
      <li class="timeline-item ${isDone ? 'done' : ''}" onclick="toggleTask('${key}', this)">
        <span class="tl-marker ${item.s}"></span>
        <span class="tl-time">${item.t}</span>
        <span class="tl-label">${item.l}</span>
        <span class="tl-check"></span>
      </li>`;
  }).join('');

  main.innerHTML = `
    ${nowHTML}
    ${buildStatsHTML(sched, doneSet)}
    <div class="timeline-card">
      <div class="timeline-title"><span class="dot"></span>${dayInfo.emoji} 今日时间表</div>
      <ul class="timeline-list">${timelineHTML}</ul>
    </div>
    ${buildWeekCardHTML()}`;
}

function toggleTask(key, el) {
  const doneSet = getDoneSet();
  if (doneSet.has(key)) {
    doneSet.delete(key);
    el.classList.remove('done');
  } else {
    doneSet.add(key);
    el.classList.add('done');
  }
  saveDoneSet(doneSet);
  refreshStats();
}

function refreshStats() {
  const dayInfo = getSchedule(new Date());
  const sched = dayInfo.schedule;
  if (!sched || sched.length === 0) return;
  const doneSet = getDoneSet();
  const statsCard = document.querySelector('.stats-card');
  if (statsCard) {
    statsCard.outerHTML = buildStatsHTML(sched, doneSet);
  }
}

// DRAWER
// ═══════════════════════════════════════

function buildDrawer() {
  const body = document.getElementById('drawerBody');
  body.innerHTML = DRAWER_SECTIONS.map((sec, i) => `
    <div class="accordion" id="acc${i}">
      <div class="accordion-header" onclick="toggleAccordion(${i})">
        <span>${sec.title}</span>
        <span class="accordion-arrow">▶</span>
      </div>
      <div class="accordion-body">
        <div class="accordion-inner">${sec.html}</div>
      </div>
    </div>
  `).join('');
}

function toggleAccordion(i) {
  document.getElementById('acc' + i).classList.toggle('open');
}

function openDrawer() {
  document.getElementById('drawer').classList.add('open');
  document.getElementById('overlay').classList.add('open');
}

function closeDrawer() {
  document.getElementById('drawer').classList.remove('open');
  document.getElementById('overlay').classList.remove('open');
}

// ═══════════════════════════════════════
// NOTIFICATIONS
// ═══════════════════════════════════════

const NOTIFY_TIMES = [
  { hour: 9, minute: 0, id: '0900', label: '☀️ 早上好！新的一天开始了' },
  { hour: 11, minute: 0, id: '1100', label: '🍌 健身日练前加餐：吃香蕉+坚果', gymOnly: true },
  { hour: 14, minute: 0, id: '1400', label: '📖 下午学习开始，加油！' },
  { hour: 19, minute: 25, id: '1925', label: '🔵 政治1000题代练 5分钟后开始！', polClassOnly: true, sticky: true },
  { hour: 20, minute: 0, id: '2000', label: '🌙 晚间复盘时间' },
];

// Political class dates (June 29 - July 31, 2026, specific weeks)
function isPoliticalClassDay(date) {
  const d = new Date(date);
  const day = d.getDay(); // 0=Sun
  const month = d.getMonth(); // 5=June, 6=July
  const dom = d.getDate();
  // Week 1: Jun 29(Mon)-Jul 3(Fri)
  if (month === 5 && dom >= 29 && dom <= 30 && day >= 1 && day <= 5) return true;
  if (month === 6 && dom === 1 && day >= 1 && day <= 5) return true; // Jul 1 Wed
  if (month === 6 && dom === 2 && day >= 1 && day <= 5) return true; // Jul 2 Thu
  if (month === 6 && dom === 3 && day >= 1 && day <= 5) return true; // Jul 3 Fri
  // Week 2: Jul 7(Tue)-10(Fri)
  if (month === 6 && dom >= 7 && dom <= 10 && day >= 2 && day <= 5) return true;
  // Week 3: Jul 14(Tue)-17(Fri)
  if (month === 6 && dom >= 14 && dom <= 17 && day >= 2 && day <= 5) return true;
  // Week 4: Jul 21(Tue)-24(Fri)
  if (month === 6 && dom >= 21 && dom <= 24 && day >= 2 && day <= 5) return true;
  // Week 5: Jul 28(Tue)-31(Fri)
  if (month === 6 && dom >= 28 && dom <= 31 && day >= 2 && day <= 5) return true;
  return false;
}

let notifiedToday = new Set();
let notifyPermission = 'default';

function initNotifications() {
  if (!('Notification' in window)) return;
  notifyPermission = Notification.permission;
  if (notifyPermission === 'default') {
    // Check if user previously dismissed the banner
    const dismissed = localStorage.getItem('notify_dismissed_at');
    if (dismissed) {
      const daysSince = (Date.now() - parseInt(dismissed)) / (1000 * 60 * 60 * 24);
      if (daysSince < 30) return; // Don't show if dismissed within 30 days
    }
    // Show banner after a short delay
    setTimeout(() => {
      document.getElementById('notifyBanner').classList.add('show');
    }, 2000);
  }
}

async function requestNotify() {
  if (!('Notification' in window)) return;
  const result = await Notification.requestPermission();
  notifyPermission = result;
  document.getElementById('notifyBanner').classList.remove('show');
  if (result === 'granted') {
    sendNotification('🔔 通知已开启', '你将在关键时间点收到学习提醒');
  }
}

function dismissNotify() {
  document.getElementById('notifyBanner').classList.remove('show');
  localStorage.setItem('notify_dismissed_at', Date.now().toString());
}

function sendNotification(title, body, opts = {}) {
  if (notifyPermission !== 'granted') return;
  const tag = opts.tag || 'kaoyan-reminder';
  const requireInteraction = opts.sticky || false;
  try {
    if ('serviceWorker' in navigator && navigator.serviceWorker.controller) {
      navigator.serviceWorker.ready.then(reg => {
        reg.showNotification(title, {
          body: body,
          icon: 'data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><text y="80" font-size="80">📚</text></svg>',
          badge: 'data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><text y="80" font-size="80">📚</text></svg>',
          vibrate: [200, 100, 200],
          requireInteraction: requireInteraction,
          renotify: true,
          silent: false,
          tag: tag,
        }).catch(() => {
          try { new Notification(title, { body: body, vibrate: [200, 100, 200], requireInteraction }); } catch {}
        });
      });
    } else {
      try { new Notification(title, { body: body, vibrate: [200, 100, 200], requireInteraction }); } catch {}
    }
  } catch (e) {
    try { new Notification(title, { body: body }); } catch {}
  }
}

function checkNotifications() {
  if (notifyPermission !== 'granted') return;
  const now = new Date();
  const todayKey = getTodayKey();
  const dayInfo = getSchedule(now);

  // Reset notified set at midnight
  if (!document.body.dataset.lastDate || document.body.dataset.lastDate !== todayKey) {
    notifiedToday.clear();
    document.body.dataset.lastDate = todayKey;
  }

  for (const nt of NOTIFY_TIMES) {
    if (notifiedToday.has(nt.id)) continue;
    if (dayInfo.rest) continue; // No notifications on rest days

    // Check if gymOnly and today is not a gym day
    if (nt.gymOnly && !dayInfo.gym) continue;
    // Check if polClassOnly and today is not a political class day
    if (nt.polClassOnly && !isPoliticalClassDay(now)) continue;

    if (now.getHours() === nt.hour && now.getMinutes() >= nt.minute && now.getMinutes() < nt.minute + 10) {
      notifiedToday.add(nt.id);
      sendNotification(nt.label, dayInfo.tag, {
        tag: nt.id,
        sticky: nt.sticky || false
      });
    }
  }
}

if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('./sw.js').catch(() => {});

// ═══════════════════════════════════════
// INIT
// ═══════════════════════════════════════

buildDrawer();
render();
initNotifications();

// Refresh every 30 seconds (more responsive for notifications)
setInterval(() => {
  render();
  checkNotifications();
}, 30000);

// Initial notification check
checkNotifications();

// Handle visibility change (refresh on return)
document.addEventListener('visibilitychange', () => {
  if (!document.hidden) {
    render();
    checkNotifications();
  }
});

// Close drawer on swipe (simple touch handling)
let touchStartX = 0;
document.addEventListener('touchstart', e => {
  touchStartX = e.touches[0].clientX;
});
document.addEventListener('touchend', e => {
  const diff = e.changedTouches[0].clientX - touchStartX;
  if (diff < -60) closeDrawer(); // Swipe left to close
});
</script>
