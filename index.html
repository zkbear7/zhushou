<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>考研助手 · 每日仪表盘</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#fdf8f4">
<!-- v14: 三门基础→三科强化·线代8.2-8.12例题全写·概率8.13接棒·30讲节级分级表·强化啃书为主·8.2更新 -->
<link rel="manifest" href="./manifest.json">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/lxgw-wenkai-screen-webfont@1.7.0/style.css">
<style>
:root {
  --bg: #fdf8f4;
  --card: #fffefb;
  --card2: #faf6f0;
  --text: #3d3929;
  --text2: #8b8680;
  --text3: #b8b3ab;
  --divider: #e8e3dc;
  --accent: #c4a882;
  --accent-light: #e8dccf;
  --green: #a3b899;
  --green-light: #e2ecda;
  --rose: #c8a8a8;
  --rose-light: #f0e4e4;
  --lavender: #b8b0c8;
  --lavender-light: #e8e4f0;
  --amber: #d4b896;
  --amber-light: #f0e4d4;
  --radius: 14px;
  --radius-sm: 10px;
  --shadow: 0 2px 12px rgba(61,57,41,0.06);
  --font: 'LXGW WenKai Screen', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif;
  --transition: 0.25s cubic-bezier(0.4, 0, 0.2, 1);
}

* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { height: 100%; overflow: hidden; }
body {
  font-family: var(--font);
  background: var(--bg);
  color: var(--text);
  -webkit-font-smoothing: antialiased;
  display: flex;
  flex-direction: column;
  user-select: none;
  -webkit-tap-highlight-color: transparent;
}

/* ── Top Bar ── */
.topbar {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 14px 20px;
  background: var(--card);
  border-bottom: 1px solid var(--divider);
  flex-shrink: 0;
  z-index: 10;
}
.menu-btn {
  width: 40px; height: 40px;
  border: none; background: none;
  font-size: 22px; cursor: pointer;
  border-radius: var(--radius-sm);
  display: flex; align-items: center; justify-content: center;
  color: var(--text);
  flex-shrink: 0;
}
.menu-btn:active { background: var(--accent-light); }
.countdown-badge {
  display: flex; align-items: center; gap: 8px;
  margin-left: auto;
  background: var(--accent-light);
  padding: 8px 16px;
  border-radius: 20px;
  font-size: 14px;
  color: var(--text);
  font-weight: 500;
}
.countdown-num {
  font-size: 22px;
  font-weight: 700;
  color: #8b6f4e;
  line-height: 1;
}
.today-label {
  font-size: 15px;
  color: var(--text2);
  font-weight: 500;
}

/* ── Main Content ── */
.main {
  flex: 1;
  overflow-y: auto;
  padding: 16px 20px 32px;
  display: flex;
  flex-direction: column;
  gap: 16px;
  -webkit-overflow-scrolling: touch;
}

/* ── Now Card ── */
.now-card {
  background: var(--card);
  border-radius: var(--radius);
  padding: 22px 20px;
  box-shadow: var(--shadow);
  border: 1px solid var(--divider);
  text-align: center;
}
.now-time {
  font-size: 14px;
  color: var(--text2);
  letter-spacing: 0.5px;
}
.now-task-icon {
  font-size: 40px;
  margin: 8px 0 4px;
  line-height: 1;
}
.now-task-title {
  font-size: 24px;
  font-weight: 700;
  color: var(--text);
  line-height: 1.4;
}
.now-task-sub {
  font-size: 15px;
  color: var(--text2);
  margin-top: 2px;
}
.now-task-time {
  display: inline-block;
  margin-top: 10px;
  padding: 4px 14px;
  background: var(--accent-light);
  border-radius: 12px;
  font-size: 13px;
  color: #8b6f4e;
  font-weight: 500;
}

/* ── Timeline ── */
.timeline-card {
  background: var(--card);
  border-radius: var(--radius);
  padding: 18px 16px;
  box-shadow: var(--shadow);
  border: 1px solid var(--divider);
}
.timeline-title {
  font-size: 15px;
  font-weight: 600;
  color: var(--text2);
  margin-bottom: 14px;
  letter-spacing: 0.5px;
  display: flex;
  align-items: center;
  gap: 8px;
}
.timeline-title .dot {
  width: 8px; height: 8px;
  border-radius: 50%;
  background: var(--accent);
}
.timeline-list { list-style: none; display: flex; flex-direction: column; gap: 2px; }
.timeline-item {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 10px 12px;
  border-radius: var(--radius-sm);
  cursor: pointer;
  transition: var(--transition);
  position: relative;
}
.timeline-item:active { background: var(--bg); }
.timeline-item.done .tl-label { text-decoration: line-through; opacity: 0.45; }
.timeline-item.done .tl-marker { opacity: 0.3; }
.tl-marker {
  width: 10px; height: 10px;
  border-radius: 50%;
  flex-shrink: 0;
  transition: var(--transition);
}
.tl-marker.math { background: var(--amber); }
.tl-marker.eng  { background: var(--lavender); }
.tl-marker.pro  { background: var(--green); }
.tl-marker.gym  { background: var(--rose); }
.tl-marker.rest { background: #d0d0d0; }
.tl-marker.eat  { background: #e0d8c8; }
.tl-marker.pol  { background: #d4a9a9; }
.tl-time {
  font-size: 13px;
  color: var(--text3);
  width: 80px;
  flex-shrink: 0;
  font-variant-numeric: tabular-nums;
}
.tl-label {
  font-size: 15px;
  color: var(--text);
  flex: 1;
  transition: var(--transition);
}
.tl-check {
  width: 22px; height: 22px;
  border-radius: 50%;
  border: 2px solid var(--divider);
  flex-shrink: 0;
  display: flex; align-items: center; justify-content: center;
  font-size: 12px;
  transition: var(--transition);
}
.timeline-item.done .tl-check {
  background: var(--green);
  border-color: var(--green);
  color: white;
}
.tl-check::after { content: ''; }
.timeline-item.done .tl-check::after { content: '✓'; }

/* ── Drawer Overlay ── */
.overlay {
  position: fixed; inset: 0;
  background: rgba(61,57,41,0.25);
  z-index: 20;
  opacity: 0;
  pointer-events: none;
  transition: opacity var(--transition);
}
.overlay.open { opacity: 1; pointer-events: auto; }

/* ── Side Drawer ── */
.drawer {
  position: fixed;
  left: 0; top: 0; bottom: 0;
  width: 420px;
  max-width: 94vw;
  background: var(--card);
  z-index: 30;
  box-shadow: 2px 0 24px rgba(61,57,41,0.1);
  transform: translateX(-100%);
  transition: transform var(--transition);
  display: flex;
  flex-direction: column;
  overflow: hidden;
}
.drawer.open { transform: translateX(0); }
.drawer-header {
  padding: 20px 18px 14px;
  border-bottom: 1px solid var(--divider);
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-shrink: 0;
}
.drawer-title { font-size: 17px; font-weight: 600; color: var(--text); }
.drawer-close {
  width: 36px; height: 36px;
  border: none; background: none;
  font-size: 20px; cursor: pointer;
  border-radius: 50%;
  color: var(--text2);
  display: flex; align-items: center; justify-content: center;
}
.drawer-close:active { background: var(--bg); }
.drawer-body {
  flex: 1;
  overflow-y: auto;
  padding: 8px 0;
  -webkit-overflow-scrolling: touch;
}

/* ── Drawer Accordion ── */
.accordion {
  border-bottom: 1px solid var(--divider);
}
.accordion-header {
  display: flex; align-items: center; justify-content: space-between;
  padding: 14px 18px;
  cursor: pointer;
  font-size: 15px;
  font-weight: 500;
  color: var(--text);
  transition: var(--transition);
}
.accordion-header:active { background: var(--bg); }
.accordion-arrow {
  font-size: 12px;
  color: var(--text3);
  transition: transform var(--transition);
}
.accordion.open .accordion-arrow { transform: rotate(90deg); }
.accordion-body {
  max-height: 0;
  overflow: hidden;
  transition: max-height 0.35s ease;
}
/* v14: 面板内容可超过2000px（30讲分级表18卡）·drawer-body滚动条兜底 */
.accordion.open .accordion-body { max-height: 10000px; }
.accordion-inner {
  padding: 0 18px 16px;
  overflow-x: auto;
  -webkit-overflow-scrolling: touch;
}
.accordion-inner table {
  min-width: 100%;
  border-collapse: collapse;
  font-size: 12px;
}
.accordion-inner th {
  text-align: left;
  padding: 6px 6px 4px;
  font-size: 10px;
  color: var(--text3);
  font-weight: 500;
  letter-spacing: 0.5px;
  white-space: nowrap;
}
.accordion-inner td {
  padding: 6px 6px;
  border-top: 1px solid var(--divider);
  color: var(--text);
  line-height: 1.5;
}
.priority-dot {
  display: inline-block;
  width: 8px; height: 8px;
  border-radius: 50%;
  margin-right: 6px;
  vertical-align: middle;
}
.priority-dot.red { background: #d48585; }
.priority-dot.yellow { background: #d4c885; }
.priority-dot.orange { background: #d4a878; }
.priority-dot.green { background: #a3b899; }
.priority-dot.gray { background: #c0c0c0; }
.tag {
  display: inline-block;
  padding: 2px 8px;
  border-radius: 8px;
  font-size: 11px;
  font-weight: 500;
  margin: 1px 2px;
}
.tag.red { background: #fce8e8; color: #a05050; }
.tag.green { background: #e8f0e0; color: #5a805a; }
.tag.blue { background: #e0e8f0; color: #506888; }
.tag.amber { background: #f0ead8; color: #806840; }
.tag.gray { background: #efeded; color: #8b8680; }

/* ── v14: 卡片式面板（宽表转卡片·不挤字） ── */
.c-card {
  background: var(--card2);
  border: 1px solid var(--divider);
  border-radius: 10px;
  padding: 8px 12px 9px;
  margin-bottom: 8px;
}
.c-title {
  font-size: 12.5px;
  font-weight: 600;
  color: var(--text);
  margin-bottom: 4px;
  padding-bottom: 4px;
  border-bottom: 1px dashed var(--divider);
  display: flex;
  align-items: center;
  gap: 6px;
}
.c-title .c-sub { margin-left: auto; font-size: 10.5px; font-weight: 500; color: var(--text3); }
.c-row {
  font-size: 12px;
  line-height: 1.7;
  color: var(--text);
  padding: 2px 0;
}
.c-row .tag { margin-right: 6px; }

/* ── Notification Permission Banner ── */
.notify-banner {
  display: none;
  align-items: center;
  gap: 12px;
  padding: 12px 16px;
  background: var(--amber-light);
  margin: 0 20px 8px;
  border-radius: var(--radius-sm);
  font-size: 14px;
  color: #6b5530;
}
.notify-banner.show { display: flex; }
.notify-btn {
  margin-left: auto;
  border: none;
  background: #8b6f4e;
  color: white;
  padding: 8px 16px;
  border-radius: 16px;
  font-size: 13px;
  font-family: var(--font);
  cursor: pointer;
  white-space: nowrap;
}
.notify-btn:active { opacity: 0.8; }
.notify-dismiss {
  background: none;
  border: none;
  font-size: 18px;
  cursor: pointer;
  color: #8b6f4e;
  padding: 4px;
}

/* ── Rest Day Card ── */
.rest-card {
  text-align: center;
  padding: 40px 20px;
  background: var(--card);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  border: 1px solid var(--divider);
}
.rest-icon { font-size: 56px; margin-bottom: 8px; }
.rest-text { font-size: 20px; font-weight: 600; color: var(--text); }
.rest-sub { font-size: 14px; color: var(--text2); margin-top: 6px; }

/* ── Week Card ── */
.week-card {
  background: var(--card);
  border-radius: var(--radius);
  padding: 16px 18px;
  box-shadow: var(--shadow);
  border: 1px solid var(--divider);
}
.week-card .week-title {
  font-size: 14px; font-weight: 600; color: var(--text2);
  margin-bottom: 10px;
  display: flex; align-items: center; gap: 6px;
}
.week-subject {
  margin-bottom: 8px;
}
.week-subject:last-child { margin-bottom: 0; }
.week-sub-name {
  font-size: 12px; font-weight: 600; color: var(--text3);
  letter-spacing: 0.5px; margin-bottom: 2px;
}
.week-sub-item {
  font-size: 13px; color: var(--text); line-height: 1.6;
  padding-left: 8px;
}

/* ── Full Plan Drawer ── */
.plan-phase {
  margin-bottom: 12px;
}
.plan-phase-title {
  font-size: 14px; font-weight: 600; color: var(--text);
  margin-bottom: 4px;
}
.plan-phase table { width: 100%; border-collapse: collapse; font-size: 11px; }
.plan-phase th { text-align: left; padding: 3px 4px; font-size: 10px; color: var(--text3); border-bottom: 1px solid var(--divider); }
.plan-phase td { padding: 3px 4px; border-bottom: 1px solid var(--divider); color: var(--text); }
.plan-phase .done-tag { font-size: 10px; padding: 1px 6px; border-radius: 6px; }
.done-tag.math { background: var(--amber-light); color: #806840; }
.done-tag.pro { background: var(--green-light); color: #5a805a; }
.done-tag.eng { background: var(--lavender-light); color: #506888; }
.done-tag.pol { background: var(--rose-light); color: #a05050; }

/* ── Scrollbar ── */
.main::-webkit-scrollbar, .drawer-body::-webkit-scrollbar { width: 4px; }
.main::-webkit-scrollbar-thumb, .drawer-body::-webkit-scrollbar-thumb { background: var(--divider); border-radius: 4px; }

/* ── Responsive for tablet ── */
@media (min-width: 768px) {
  .main { padding: 20px 32px 32px; }
  .now-card { padding: 28px 24px; }
  .now-task-title { font-size: 28px; }
  .timeline-card { padding: 22px 20px; }
  .tl-time { width: 100px; }
}
</style>
</head>
<body>

<!-- PIN Lock Screen -->

<!-- Side Drawer -->
<div class="overlay" id="overlay" onclick="closeDrawer()"></div>
<aside class="drawer" id="drawer">
  <div class="drawer-header">
    <span class="drawer-title">📖 备考资料库</span>
    <button class="drawer-close" onclick="closeDrawer()">✕</button>
  </div>
  <div class="drawer-body" id="drawerBody"></div>
</aside>

<!-- Top Bar -->
<header class="topbar">
  <button class="menu-btn" onclick="openDrawer()" aria-label="菜单">☰</button>
  <span class="today-label" id="todayLabel"></span>
  <div class="countdown-badge">
    <span>距初试</span>
    <span class="countdown-num" id="countdownNum"></span>
    <span>天</span>
  </div>
</header>

<!-- Notification Permission -->
<div class="notify-banner" id="notifyBanner">
  <span>🔔</span>
  <span>开启通知，准时提醒学习</span>
  <button class="notify-dismiss" onclick="dismissNotify()">✕</button>
  <button class="notify-btn" onclick="requestNotify()">开启</button>
</div>

<!-- Main -->
<main class="main" id="mainContent"></main>

<script>

const EXAM_DATE = new Date(2026, 11, 19); // Dec 19, 2026（考研预测）

// ── June 2026 daily schedules (date-specific) ──
const JUNE_DAYS = {

    { t:'09:00-12:00', l:'六级真题阅读精做', s:'eng' },

// Generate June recurring days
function genJuneSchedules() {
  const sched = {};
  for (let d = 5; d <= 30; d++) {
    const key = `2026-06-${String(d).padStart(2,'0')}`;
    if (JUNE_DAYS[key]) { sched[key] = JUNE_DAYS[key]; continue; }

        { t:'每天', l:'闪过单词 100 词', s:'eng' },
      ]};
    } else if (d >= 24 && d <= 28 && d !== 28) {
      sched[key] = { tag: '期末备考', emoji: '📚', schedule: [
        { t:'全天', l:'全力备考期末（6.28 考试）', s:'rest' },
        { t:'晚间余力', l:'线代 30 讲视频 2x 纯看（磨耳朵）', s:'math' },
        { t:'每天', l:'闪过单词 100 词', s:'eng' },
      ]};
    }
  }
  return sched;
}
const JUNE = genJuneSchedules();

// ── July+ recurring schedules (v5: 按星期几决定自控/英语) ──
// v116: 不看星期几 —— 隔天轮换：一天自控 · 一天英语，从 10.09 连着排到考试（见 isSelfControlDay）
//       休息日也不固定：累了就休半天 → 当天/前一天告诉我，把日期写进 REST_DAYS 才显示休息

const AUTOCTRL_DAY = [  // 自控日（隔天一次）（v29·9.4改：7:30起·8:30到教室·14:30下午·19:00政治·19:30线代·21:30收工）

// 10.09 自控 → 10.10 英语 → 10.11 自控 → 10.12 英语 → ……（按日期奇偶，不受"休了半天"影响、不会错位）
const ALT_ANCHOR = '2026-10-09';
function isSelfControlDay(date) {
  const a = new Date(ALT_ANCHOR + 'T00:00:00');
  const b = new Date(fmtDate(date) + 'T00:00:00');
  const off = Math.round((b - a) / 86400000);
  return off % 2 === 0;   // 偶数偏移＝自控日 · 奇数偏移＝英语日
}

function fmtDate(d) {
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}

// Period tracking: 30-day cycle, 6-day duration, first 4 days no gym
// Cycle 1: Jul 1-6 (no gym Jul 1-4), Cycle 2: Jul 31-Aug 5 (no gym Jul 31-Aug 3), etc.
function getPeriodInfo(date) {
  const cycleStart = new Date(2026, 8, 2); // Sep 2, 2026 (9.2实际开始·下周期约10.2)
  const cycleLen = 30;
  const periodLen = 6;
  const noGymLen = 4; // first 4 days of period: no fitness

  const diffDays = Math.floor((date - cycleStart) / (1000 * 60 * 60 * 24));
  if (diffDays < 0) return null;

  const cycleDay = diffDays % cycleLen;
  if (cycleDay < periodLen) {
    return {
      active: true,
      cycleDay: cycleDay + 1,  // 1-indexed
      noGym: cycleDay < noGymLen,  // first 4 days
      totalDays: periodLen
    };
  }
  return null;
}

function getCurrentTask(schedule, now) {
  if (!schedule || schedule.length === 0) return null;
  const currentMinutes = now.getHours() * 60 + now.getMinutes();

  let currentTask = null;
  let nextTask = null;

  for (let i = 0; i < schedule.length; i++) {
    const item = schedule[i];
    const timeStr = item.t;
    // Parse time range like "09:00-12:00" or "11:00-11:15" or simpler patterns
    const match = timeStr.match(/(\d{1,2}):(\d{2})\s*[-–]\s*(\d{1,2}):(\d{2})/);
    if (!match) continue;
    const startMin = parseInt(match[1]) * 60 + parseInt(match[2]);
    const endMin = parseInt(match[3]) * 60 + parseInt(match[4]);

    if (currentMinutes >= startMin && currentMinutes < endMin) {
      currentTask = { item, startMin, endMin };
      break;
    } else if (currentMinutes < startMin && !nextTask) {
      nextTask = { item, startMin, endMin };
    }
  }

  if (currentTask) return { type: 'now', ...currentTask };
  if (nextTask) return { type: 'next', ...nextTask };
  return { type: 'done', item: { t:'今天的学习结束了', l:'休息吧，明天继续加油 🌙', s:'rest' }, startMin: 0, endMin: 0 };
}

function getDoneSet() {
  const key = 'done_' + getTodayKey();
  try {
    const raw = localStorage.getItem(key);
    return raw ? new Set(JSON.parse(raw)) : new Set();
  } catch { return new Set(); }
}

function saveDoneSet(s) {
  const key = 'done_' + getTodayKey();
  localStorage.setItem(key, JSON.stringify([...s]));
}

// Clean old keys
function cleanOldStorage() {
  const today = getTodayKey();
  const keys = Object.keys(localStorage).filter(k => k.startsWith('done_'));
  keys.forEach(k => {
    if (k !== 'done_' + today) localStorage.removeItem(k);
  });
}

function render() {
  cleanOldStorage();
  const now = new Date();
  const dateKey = getTodayKey();
  const dayInfo = getSchedule(now);
  const doneSet = getDoneSet();

  const daysLeft = Math.ceil((EXAM_DATE - now) / (1000 * 60 * 60 * 24));

      <div class="timeline-card" style="margin-top:14px;">

          <li class="timeline-item"><span class="tl-marker math"></span><span class="tl-label">${getDailyMathTask(now)}</span><span class="tl-check"></span></li>

          <li class="timeline-item"><span class="tl-marker math"></span><span class="tl-label">🔢 14:30-18:00（可选）：累就继续休；有劲就把本周欠账清完</span><span class="tl-check"></span></li>
        </ul>
        <div style="font-size:11px;color:var(--text3);margin-top:4px;">固定顺序：① 本周欠账题块 → ② 本周⭐/△错题重做 → ③ 都清完了才往下推进（推不动就停，别硬补）｜晚上 19:00 之后不排任何任务</div>
      </div>`;
    main.innerHTML = `
      <div class="rest-card">
        <div class="rest-icon">${dayInfo.fullOff ? '🎉' : '📚'}</div>
        <div class="rest-text">${dayInfo.fullOff ? '今天全休 · 出去玩' : '休息半天（你自己定的）· 上午 3h，有劲再加下午 3.5h'}</div>
        <div class="rest-sub">${dayInfo.fullOff ? '今天<b>不排任何任务</b>，欠的顺延消化 🔋' : '休息日不再固定：上午 3h 消欠账/⭐错题 ＋ 30min 周复盘；<b>下午累就继续休，有劲才上 14:30-18:00</b>；晚上一律休 🔋'}</div>
      </div>
      ${restListHTML}
      ${buildWeeklyReviewCard()}
      ${nextWeekHTML}`;
    return;
  }

  const sched = dayInfo.schedule;
  const current = getCurrentTask(sched, now);

  // Current task
  const iconMap = { math:'🔢', eng:'📝', pro:'⚙️', gym:'🏃', rest:'💤', eat:'🍜', pol:'📜' };
  let nowHTML = '';
  if (current.type === 'now') {
    nowHTML = `
      <div class="now-card">
        <div class="now-time">现在应该在做…</div>
        <div class="now-task-icon">${iconMap[current.item.s] || '📌'}</div>
        <div class="now-task-title">${current.item.l}</div>
        <div class="now-task-time">${current.item.t}</div>
      </div>`;
  } else if (current.type === 'next') {
    nowHTML = `
      <div class="now-card">
        <div class="now-time">接下来…</div>
        <div class="now-task-icon">⏰</div>
        <div class="now-task-title">${current.item.l}</div>
        <div class="now-task-time">${current.item.t}</div>
      </div>`;
  } else {
    nowHTML = `
      <div class="now-card">
        <div class="now-time">${current.item.l.includes('结束') ? '🎉' : '✨'}</div>
        <div class="now-task-title" style="font-size:20px;">${current.item.l}</div>
      </div>`;
  }

  // Timeline
  let timelineHTML = sched.map((item, i) => {
    const key = `${dateKey}_${i}`;
    const isDone = doneSet.has(key);
    return `
      <li class="timeline-item ${isDone ? 'done' : ''}" onclick="toggleTask('${key}', this)">
        <span class="tl-marker ${item.s}"></span>
        <span class="tl-time">${item.t}</span>
        <span class="tl-label">${item.l}</span>
        <span class="tl-check"></span>
      </li>`;
  }).join('');

  // 今日任务卡片（始终显示今天）
  const todayCardHTML = buildDailySubjectCard(dayInfo, now, true);

  // 明日任务预览（每天显示，方便提前拿书）
  const tomorrowDate = new Date(now.getTime() + 86400000);
  const tomorrowInfo = getSchedule(tomorrowDate);
  const tomorrowWD = ["日","一","二","三","四","五","六"][tomorrowDate.getDay()];
  let tomorrowCardHTML = "";
  if (tomorrowInfo.rest) {
    tomorrowCardHTML = '<div class="timeline-card" style="margin-top:14px;opacity:0.85;"><div class="timeline-title"><span class="dot"></span>📅 明天（周' + tomorrowWD + '）· 📚 休息半天（你自己定的）</div><div style="font-size:13px;color:var(--text2);padding:8px 0;line-height:1.8;">📚 上午 8:30-11:30 消欠账/⭐错题(3h) → 11:30-12:00 周复盘(30min)<br>🔢 下午 14:30-18:00 <b>累就继续休</b>，有劲才清欠账 🔋（晚上一律休）</div></div>';
    const afterDate = new Date(tomorrowDate.getTime() + 86400000);
    const afterInfo = getSchedule(afterDate);
    if (!afterInfo.rest) {
      const afterWD = ["日","一","二","三","四","五","六"][afterDate.getDay()];
      const afterRaw = buildDailySubjectCard(afterInfo, afterDate, false);
      if (afterRaw) {
        tomorrowCardHTML += afterRaw.replace("📋 今日打卡清单（周" + afterWD + "）", "📋 后天任务预览 · 周" + afterWD + "（提前拿书）");
      }
    }
  } else {
    const raw = buildDailySubjectCard(tomorrowInfo, tomorrowDate, false);
    if (raw) {
      tomorrowCardHTML = raw.replace("📋 今日打卡清单（周" + tomorrowWD + "）", "📋 明天任务预览 · 周" + tomorrowWD + "（提前拿书）");
    }
  }

  main.innerHTML = `
    ${nowHTML}
    <div class="timeline-card">
      <div class="timeline-title"><span class="dot"></span>${dayInfo.emoji} 今日时间表</div>
      <ul class="timeline-list">${timelineHTML}</ul>
    </div>
    ${todayCardHTML}
    ${tomorrowCardHTML}
    ${now.getDay() === 5 ? buildWeeklyReviewCard(true) : ''}
    ${buildWeekCardHTML()}`;
}

function toggleTask(key, el) {
  const doneSet = getDoneSet();
  if (doneSet.has(key)) {
    doneSet.delete(key);
    el.classList.remove('done');
  } else {
    doneSet.add(key);
    el.classList.add('done');
  }
  saveDoneSet(doneSet);
}

// 英一翻译 · 每次一练（柴荣体系·每周3次）
// ═══════════════════════════════════════

const FANYI_START = '2026-10-04';
const FANYI_TOTAL = 33;
let fanyiDay = null;
let fanyiShowSplit = false;
let fanyiShowAns = false;

function fanyiIsEngDay(d) {
  return !isSelfControlDay(d);        // v116: 英语日＝隔天轮换里非自控的那天（不再看星期几）
}
function fanyiMidnight(d) {
  return new Date(d.getFullYear(), d.getMonth(), d.getDate());
}
function fanyiStartDate() {
  return new Date(FANYI_START + 'T00:00:00');
}
// 第 n 次练习的日期
function fanyiDateForIndex(n) {
  const d = fanyiStartDate();
  let c = 0;
  for (let guard = 0; guard < 400; guard++) {
    if (fanyiIsEngDay(d)) { c++; if (c === n) return d; }
    d.setDate(d.getDate() + 1);
  }
  return null;
}
// 截至 date（含）已经过了多少次翻译日；早于起点返回 0
function fanyiIndexForDate(date) {
  const t0 = fanyiStartDate();
  const d = fanyiMidnight(date);
  if (d < t0) return 0;
  let c = 0;
  const cur = new Date(t0.getTime());
  while (cur <= d) {
    if (fanyiIsEngDay(cur)) c++;
    cur.setDate(cur.getDate() + 1);
  }
  return c;
}
function fanyiTodayIndex() {
  return Math.min(FANYI_TOTAL, fanyiIndexForDate(new Date()));
}
// 今天之后的下一个翻译日（含今天判断）
function fanyiNextEngDate(afterToday) {
  const base = fanyiMidnight(new Date());
  for (let i = (afterToday ? 1 : 0); i <= 8; i++) {
    const x = new Date(base.getTime());
    x.setDate(x.getDate() + i);
    if (fanyiIsEngDay(x)) return x;
  }
  return null;
}
function fanyiFmtDate(d) {
  return (d.getMonth() + 1) + '.' + d.getDate();
}
function fanyiFmtWd(d) {
  return '周' + ['日', '一', '二', '三', '四', '五', '六'][d.getDay()];
}

function fanyiData(day) {
  if (typeof FANYI_DAYS === 'undefined') return null;
  return FANYI_DAYS.find(function (x) { return x.d === day; }) || null;
}
function fanyiGet(k) {
  try { return localStorage.getItem('fanyi:' + k); } catch (e) { return null; }
}
function fanyiSet(k, v) {
  try { localStorage.setItem('fanyi:' + k, v); } catch (e) {}
}
function fanyiSetDay(i) {
  fanyiDay = Math.max(1, Math.min(FANYI_TOTAL, i));
  fanyiShowSplit = false;
  fanyiShowAns = false;
  renderFanyi();
}
function fanyiGoToday() { fanyiSetDay(fanyiTodayIndex() || 1); }
function fanyiToggleSplit() { fanyiShowSplit = !fanyiShowSplit; renderFanyi(); }
function fanyiToggleAns() { fanyiShowAns = !fanyiShowAns; renderFanyi(); }

function fanyiPick(qi, oi, correct) {
  const el = document.getElementById('fq_' + qi + '_' + oi);
  if (!el) return;
  if (oi === correct) {
    el.style.background = '#e6f0e4';
    el.style.borderColor = '#a3b899';
    el.innerHTML = '✅ ' + el.dataset.t;
  } else {
    el.style.background = '#f6e3e3';
    el.style.borderColor = '#c8a8a8';
    el.innerHTML = '❌ ' + el.dataset.t;
    const ok = document.getElementById('fq_' + qi + '_' + correct);
    if (ok) {
      ok.style.background = '#e6f0e4';
      ok.style.borderColor = '#a3b899';
      ok.innerHTML = '✅ ' + ok.dataset.t;
    }
  }
}
function fanyiSaveAns(day, val) { fanyiSet('ans:' + day, val); }
function fanyiScore(day, v) { fanyiSet('score:' + day, String(v)); renderFanyi(); }

function fanyiStats() {
  let done = 0, sum = 0;
  for (let i = 1; i <= FANYI_TOTAL; i++) {
    const s = fanyiGet('score:' + i);
    if (s !== null && s !== '') { done++; sum += parseFloat(s) || 0; }
  }
  return { done: done, avg: done ? (sum / done) : 0 };
}
function fanyiBtn(label, onclick, color) {
  return '<button onclick="' + onclick + '" style="margin:2px 4px 2px 0;padding:4px 10px;border-radius:8px;border:1px solid ' + (color || '#e0d8cc') + ';background:#fff;font-size:12px;font-family:inherit;cursor:pointer;color:#3d3929;">' + label + '</button>';
}

function renderFanyi() {
  const box = document.getElementById('fanyiToday');
  if (!box) return;
  const today = fanyiMidnight(new Date());
  const isEng = fanyiIsEngDay(today);
  const todayIdx = fanyiTodayIndex();
  if (fanyiDay === null) fanyiDay = todayIdx > 0 ? todayIdx : 1;
  const day = fanyiDay;
  const data = fanyiData(day);
  const st = fanyiStats();
  const thisDate = fanyiDateForIndex(day);
  const next = fanyiNextEngDate(isEng);

  let h = '';

  // 顶部状态
  let head;
  if (today < fanyiStartDate()) head = '还没开始（' + FANYI_START + ' 起）';
  else if (isEng && todayIdx >= FANYI_TOTAL) head = '✅ 33 次已走完 → 转做套卷翻译';
  else if (isEng) head = '今天该做 <b>第 ' + todayIdx + ' 次</b>';
  else head = '今天不是翻译日';

  h += '<div class="c-card"><div class="c-title">🈶 翻译每次一练（每个英语日 1 次 · 每次 15min）· ' + head + '</div>';
  h += '<div class="c-row"><span class="tag red">进度</span>已打卡 <b>' + st.done + '</b> / ' + FANYI_TOTAL + ' 次 ｜ 平均自评分 <b>' + st.avg.toFixed(2) + '</b> / 2</div>';

  if (!isEng && next) {
    const nIdx = fanyiIndexForDate(next);
    h += '<div class="c-row"><span class="tag amber">下一次</span>' + fanyiFmtDate(next) + '（' + fanyiFmtWd(next) + '）→ <b>第 ' + nIdx + ' 次</b>｜翻译只排在英语日（隔天一次），自控日不排（去练写作和阅读）</div>';
  }

  h += '<div style="margin-top:6px;">' + fanyiBtn('‹ 上一次', 'fanyiSetDay(' + (day - 1) + ')')
     + fanyiBtn('回到今天', 'fanyiGoToday()', '#c4a882')
     + fanyiBtn('下一次 ›', 'fanyiSetDay(' + (day + 1) + ')') + '</div>';
  h += '<div style="font-size:11px;color:var(--text3);margin-top:4px;">当前显示：第 ' + day + ' 次' + (thisDate ? '（' + fanyiFmtDate(thisDate) + ' ' + fanyiFmtWd(thisDate) + '）' : '') + '</div></div>';

  if (!data) {
    h += '<div class="c-card"><div class="c-title">第 ' + day + ' 次 · 题目生成中</div>';
    h += '<div class="c-row"><span class="tag gray">说明</span>第 1-33 次的题库已随面板一并上线；若这里显示"待生成"，说明数据未加载，强刷（Ctrl+Shift+R）一次即可。</div></div>';
    box.innerHTML = h;
    return;
  }

  h += '<div class="c-card"><div class="c-title">第 ' + day + ' 次 · ' + data.src + ' · ' + data.skill + '</div>';
  h += '<div class="c-row"><span class="tag blue">主旨</span>' + data.topic + '</div>';
  h += '<div class="c-row"><span class="tag gray">配套语法课</span>' + data.gram + '</div></div>';

  // ① 词义热身
  h += '<div class="c-card"><div class="c-title">① 词义热身（2min·点选项即判对错）</div>';
  for (let qi = 0; qi < data.q.length; qi++) {
    const q = data.q[qi];
    h += '<div style="margin-top:6px;"><b style="font-size:13px;">' + (qi + 1) + '. ' + q[0] + '</b><div style="margin-top:3px;">';
    for (let oi = 0; oi < q[1].length; oi++) {
      h += '<button id="fq_' + qi + '_' + oi + '" data-t="' + String(q[1][oi]).replace(/"/g, '') + '" onclick="fanyiPick(' + qi + ',' + oi + ',' + q[2] + ')" style="display:block;width:100%;text-align:left;margin:3px 0;padding:5px 9px;border-radius:8px;border:1px solid #e6ded2;background:#fdfbf8;font-size:12.5px;font-family:inherit;cursor:pointer;color:#2b2b2b;">' + q[1][oi] + '</button>';
    }
    h += '</div></div>';
  }
  h += '</div>';

  // ② 断句
  h += '<div class="c-card"><div class="c-title">② 断句 + 找主干（3min）</div>';
  h += '<div style="font-size:13px;line-height:1.9;color:#2b2b2b;background:#fdfbf8;border:1px dashed #e0d8cc;border-radius:8px;padding:8px 10px;">' + data.sent + '</div>';
  h += '<div style="margin-top:6px;">' + fanyiBtn(fanyiShowSplit ? '收起断句答案' : '看断句答案', 'fanyiToggleSplit()', '#c4a882') + '</div>';
  if (fanyiShowSplit) {
    h += '<div style="font-size:12.5px;line-height:1.9;background:#f7f4ef;border:1px solid #e6ded2;border-radius:8px;padding:8px 10px;margin-top:4px;white-space:pre-wrap;">' + data.sp + '</div>';
    h += '<div class="c-row" style="margin-top:6px;"><span class="tag blue">主干</span>' + data.main + '</div>';
  }
  h += '</div>';

  // ③ 译文书写区
  const saved = fanyiGet('ans:' + day) || '';
  h += '<div class="c-card"><div class="c-title">③ 整句翻译（6min·写完整一整句中文）</div>';
  h += '<textarea id="fanyiTa" oninput="fanyiSaveAns(' + day + ', this.value)" placeholder="在这里写你的译文（自动保存）…" style="width:100%;min-height:88px;border:1px solid #e6ded2;border-radius:10px;padding:8px 10px;font-size:13px;line-height:1.8;font-family:inherit;background:#fdfbf8;color:#2b2b2b;box-sizing:border-box;resize:vertical;">' + saved + '</textarea>';
  h += '<div style="margin-top:6px;">' + fanyiBtn(fanyiShowAns ? '收起答案' : '④ 对答案（参考译文＋采分点）', 'fanyiToggleAns()', '#c4a882') + '</div>';
  if (fanyiShowAns) {
    h += '<div class="c-row" style="margin-top:8px;"><span class="tag red">参考译文（柴荣版）</span></div>';
    h += '<div style="font-size:13px;line-height:1.9;background:#fdf8f4;border-left:3px solid #c4a882;border-radius:0 8px 8px 0;padding:8px 10px;color:#3d3929;">' + data.ref + '</div>';
    h += '<div style="font-size:12.5px;font-weight:600;margin-top:10px;">采分点（每点 0.5 分）</div><table style="font-size:12px;">';
    for (let pi = 0; pi < data.pts.length; pi++) {
      h += '<tr><td style="width:52%;">' + data.pts[pi][0] + '</td><td>' + data.pts[pi][1] + '</td></tr>';
    }
    h += '</table>';
    h += '<div style="font-size:12.5px;font-weight:600;margin-top:10px;">技巧复盘</div><ul style="font-size:12px;line-height:1.75;margin:4px 0 0 16px;padding:0;">';
    for (let ti = 0; ti < data.tech.length; ti++) h += '<li>' + data.tech[ti] + '</li>';
    h += '</ul>';
    h += '<div style="font-size:12.5px;font-weight:600;margin-top:10px;color:var(--rose);">⚠️ 易错预警</div><ul style="font-size:12px;line-height:1.75;margin:4px 0 0 16px;padding:0;">';
    for (let xi = 0; xi < data.trap.length; xi++) h += '<li>' + data.trap[xi] + '</li>';
    h += '</ul>';
  }
  h += '</div>';

  // ④ 自评分
  const cur = fanyiGet('score:' + day);
  h += '<div class="c-card"><div class="c-title">④ 自评分打卡（点击即记录）</div><div>';
  const grades = [2, 1.5, 1, 0.5, 0];
  for (let gi = 0; gi < grades.length; gi++) {
    const g = grades[gi];
    const active = (cur !== null && parseFloat(cur) === g);
    h += '<button onclick="fanyiScore(' + day + ',' + g + ')" style="margin:2px 4px 2px 0;padding:5px 12px;border-radius:8px;border:1px solid ' + (active ? '#c4a882' : '#e0d8cc') + ';background:' + (active ? '#f3ece2' : '#fff') + ';font-size:12.5px;font-family:inherit;cursor:pointer;color:#3d3929;">' + g + ' 分</button>';
  }
  h += '</div>';
  h += '<div style="font-size:11px;color:var(--text3);margin-top:4px;">当前记录：' + (cur === null ? '未打卡' : cur + ' 分') + '　（1.2-1.4 及格线 ｜ ≥1.5 是 6-7 分目标水平）</div>';
  h += '<div style="margin-top:8px;font-size:11px;color:var(--text2);">最近 7 次：';
  for (let k = day - 6; k <= day; k++) {
    if (k < 1) { h += '<span style="color:#ccc;">·&nbsp;</span>'; continue; }
    const s = fanyiGet('score:' + k);
    const col = (s === null) ? '#e0d8cc' : (parseFloat(s) >= 1.5 ? '#a3b899' : (parseFloat(s) >= 1 ? '#d4b896' : '#c8a8a8'));
    h += '<span title="第 ' + k + ' 次' + (s === null ? ' 未打卡' : ' ' + s + '分') + '" style="display:inline-block;width:14px;height:14px;border-radius:4px;background:' + col + ';margin-right:3px;vertical-align:middle;"></span>';
  }
  h += '</div></div>';

  h += '<p style="font-size:11px;color:var(--text2);">📌 状态差就直接跳过，<b>不算欠账、绝不补债</b>；周末把本周错句重译一遍即可。</p>';

  box.innerHTML = h;
}


function buildDrawer() {
  const body = document.getElementById('drawerBody');
  body.innerHTML = DRAWER_SECTIONS.map((sec, i) => `
    <div class="accordion" id="acc${i}">
      <div class="accordion-header" onclick="toggleAccordion(${i})">
        <span>${sec.title}</span>
        <span class="accordion-arrow">▶</span>
      </div>
      <div class="accordion-body">
        <div class="accordion-inner">${sec.html}</div>
      </div>
    </div>
  `).join('');
}

function toggleAccordion(i) {
  document.getElementById('acc' + i).classList.toggle('open');
}

function openDrawer() {
  renderFanyi();
  document.getElementById('drawer').classList.add('open');
  document.getElementById('overlay').classList.add('open');
}

function closeDrawer() {
  document.getElementById('drawer').classList.remove('open');
  document.getElementById('overlay').classList.remove('open');
}

// ═══════════════════════════════════════
// NOTIFICATIONS
// ═══════════════════════════════════════

const NOTIFY_TIMES = [
  { hour: 8, minute: 25, id: "0825", label: (d) => isRestDay(d) ? "🔢 休息半天 8:30 开始（消欠账/⭐错题·11:30 收，接着30min周复盘）" : "🏫 到教室·🔢 高数 8:30 开始", skipRest: true },
  { hour: 11, minute: 55, id: "1155", label: "🍜 12点 午饭+午休", skipRest: true },
  { hour: 11, minute: 30, id: "1130r", label: "🗓️ 半天结束→周复盘 30min（5问+下周最该保的3件事），想吃就吃想睡就睡", restOnly: true },
  { hour: 14, minute: 25, id: "1425", label: (d) => isRestDay(d) ? "🔢 下午 14:30 清欠账？（累就继续休·有劲才上）" : "📖 下午大块·自控日⚙️自控3.5h / 英语日📝英语3.5h（约14:30·收拾完就开）", skipRest: true },
  { hour: 17, minute: 55, id: "1755", label: "🍜 晚饭+休息 1h" },
  { hour: 18, minute: 55, id: "1855", label: "📜 政治 5分钟后开始（百日班/带背/1000题刷题宝典）", polClassOnly: true, sticky: true },
  { hour: 19, minute: 25, id: "1925", label: "🧵 线代/概率 5分钟后开始（🟣概率救命课·🧵没咋了线代救命课）" },
  { hour: 20, minute: 55, id: "2055", label: "📋 21:00/21:30 收工·今日复盘+标⭐" },
];

// Political study days: 马原✅(7.17) + 8.25起每天（非休息日）·19:00-19:30
// v77: 政治定稿=张修齐主线（百日班毛特1-3/新思想速成/道法 + 史纲导学&救命课串讲 → 10.18-10.31 1000题刷题宝典一刷 → 11.06腿姐手册keywords/多选/帽子题+时政热点 → 11.16肖八8套+时政模拟 → 12.06肖四+十页纸+手写2-3道；肖八肖四已购）
function isPoliticalClassDay(date) {
  const d = new Date(date);
  const month = d.getMonth(); // 5=June, 6=July, 7=August
  const dom = d.getDate();
  const day = d.getDay(); // 0=Sun

  // Sep onwards: daily politics
  if (month >= 8) return !isRestDay(date);

  // 带刷追课期: Jul 22 - Aug 24, 隔天二四日
  if (month === 6 && dom >= 22 && dom <= 31) return day === 2 || day === 4 || day === 0;
  if (month === 7 && dom >= 1 && dom <= 24) return day === 2 || day === 4 || day === 0;

  // Aug 25-31: daily (正式启动预备)
  if (month === 7 && dom > 24) return !isRestDay(date);

  return false;
}

let notifiedToday = new Set();
let notifyPermission = 'default';

function initNotifications() {
  if (!('Notification' in window)) return;
  notifyPermission = Notification.permission;
  if (notifyPermission === 'default') {
    // Check if user previously dismissed the banner
    const dismissed = localStorage.getItem('notify_dismissed_at');
    if (dismissed) {
      const daysSince = (Date.now() - parseInt(dismissed)) / (1000 * 60 * 60 * 24);
      if (daysSince < 30) return; // Don't show if dismissed within 30 days
    }
    // Show banner after a short delay
    setTimeout(() => {
      document.getElementById('notifyBanner').classList.add('show');
    }, 2000);
  }
}

async function requestNotify() {
  if (!('Notification' in window)) return;
  const result = await Notification.requestPermission();
  notifyPermission = result;
  document.getElementById('notifyBanner').classList.remove('show');
  if (result === 'granted') {
    sendNotification('🔔 通知已开启', '你将在关键时间点收到学习提醒');
  }
}

function dismissNotify() {
  document.getElementById('notifyBanner').classList.remove('show');
  localStorage.setItem('notify_dismissed_at', Date.now().toString());
}

function sendNotification(title, body, opts = {}) {
  if (notifyPermission !== 'granted') return;
  const tag = opts.tag || 'kaoyan-reminder';
  const requireInteraction = opts.sticky || false;
  try {
    if ('serviceWorker' in navigator && navigator.serviceWorker.controller) {
      navigator.serviceWorker.ready.then(reg => {
        reg.showNotification(title, {
          body: body,
          icon: 'data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><text y="80" font-size="80">📚</text></svg>',
          badge: 'data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><text y="80" font-size="80">📚</text></svg>',
          vibrate: [200, 100, 200],
          requireInteraction: requireInteraction,
          renotify: true,
          silent: false,
          tag: tag,
        }).catch(() => {
          try { new Notification(title, { body: body, vibrate: [200, 100, 200], requireInteraction }); } catch {}
        });
      });
    } else {
      try { new Notification(title, { body: body, vibrate: [200, 100, 200], requireInteraction }); } catch {}
    }
  } catch (e) {
    try { new Notification(title, { body: body }); } catch {}
  }
}

function checkNotifications() {
  if (notifyPermission !== 'granted') return;
  const now = new Date();
  const todayKey = getTodayKey();
  const dayInfo = getSchedule(now);

  // Reset notified set at midnight
  if (!document.body.dataset.lastDate || document.body.dataset.lastDate !== todayKey) {
    notifiedToday.clear();
    document.body.dataset.lastDate = todayKey;
  }

  for (const nt of NOTIFY_TIMES) {
    if (notifiedToday.has(nt.id)) continue;
    // Rest days: only allow political class notifications
    if (dayInfo.rest && !nt.polClassOnly && !nt.restOnly && !nt.skipRest) continue;
    if (!dayInfo.rest && nt.restOnly) continue;

    // Check if skipGym and today IS a gym day (v6: 健身日9点不提示)
    if (nt.skipGym && dayInfo.gym) continue;
    // Check if gymOnly and today is not a gym day (period → gym=false)
    if (nt.gymOnly && !dayInfo.gym) continue;
    // Check if autoCtrlOnly and today is not a self-control day
    if (nt.autoCtrlOnly && !isSelfControlDay(now)) continue;
    // Check if englishOnly and today is a self-control day
    if (nt.englishOnly && isSelfControlDay(now)) continue;
    // Check if autoCtrlNoGymOrEnglish: only on autoCtrl NO-gym days OR english days
    if (nt.autoCtrlNoGymOrEnglish && isSelfControlDay(now) && dayInfo.gym) continue;
    // Check if polClassOnly and today is not a political class day
    if (nt.polClassOnly && !isPoliticalClassDay(now)) continue;

    if (now.getHours() === nt.hour && now.getMinutes() >= nt.minute && now.getMinutes() < nt.minute + 10) {
      notifiedToday.add(nt.id);
      const label = (typeof nt.label === 'function') ? nt.label(now) : nt.label;
      sendNotification(label, dayInfo.tag, {
        tag: nt.id,
        sticky: nt.sticky || false
      });
    }
  }
}

  navigator.serviceWorker.register('./sw.js').catch(() => {});

buildDrawer();
render();
initNotifications();

// Refresh every 30 seconds (more responsive for notifications)
setInterval(() => {
  render();
  checkNotifications();
}, 30000);

// Initial notification check
checkNotifications();

// Handle visibility change (refresh on return)
document.addEventListener('visibilitychange', () => {
  if (!document.hidden) {
    render();
    checkNotifications();
  }
});

// Close drawer on swipe (simple touch handling)
let touchStartX = 0;
document.addEventListener('touchstart', e => {
  touchStartX = e.touches[0].clientX;
});
document.addEventListener('touchend', e => {
  const diff = e.changedTouches[0].clientX - touchStartX;
  if (diff < -60) closeDrawer(); // Swipe left to close
});
</script>
